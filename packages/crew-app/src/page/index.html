<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Beeper — Crew</title>
    <!-- No dependency, no webfont, no sound: the dashboard must stay readable. -->
    <style>
      :root {
        --case: #1b1d1c;
        --case-edge: #2c302e;
        --lcd: #b8c4a8;
        --lcd-ink: #16211a;
        --lamp-green: #4f9d5d;
        --lamp-amber: #c08a2a;
        --lamp-red: #b3382f;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 1rem;
        background: #101211;
        color: #d7dcd8;
        font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      header { display: flex; align-items: baseline; gap: 0.75rem; margin-bottom: 1rem; }
      header h1 { font-size: 1rem; margin: 0; letter-spacing: 0.08em; text-transform: uppercase; }
      header .state { margin-left: auto; font-size: 0.8rem; opacity: 0.7; }
      .layout { display: grid; gap: 1rem; grid-template-columns: minmax(16rem, 22rem) 1fr; }
      @media (max-width: 46rem) { .layout { grid-template-columns: 1fr; } }

      .pager {
        background: var(--case);
        border: 1px solid var(--case-edge);
        border-radius: 0.9rem;
        padding: 0.9rem;
        box-shadow: inset 0 1px 0 #3a403d, 0 6px 18px #0008;
      }
      .lamp { width: 0.65rem; height: 0.65rem; border-radius: 50%; background: #3a3f3c; }
      .lamp[data-risk='green'] { background: var(--lamp-green); }
      .lamp[data-risk='amber'] { background: var(--lamp-amber); }
      .lamp[data-risk='red'] { background: var(--lamp-red); }
      .lcd {
        margin-top: 0.7rem;
        background: var(--lcd);
        color: var(--lcd-ink);
        border-radius: 0.3rem;
        padding: 0.6rem 0.7rem;
        font-size: clamp(0.85rem, 2.4vw, 1.05rem);
        letter-spacing: 0.04em;
        min-height: 7.2rem;
      }
      .lcd .row { white-space: pre; min-height: 1.5rem; }
      .lcd .empty { opacity: 0.75; }

      table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
      th, td { text-align: left; padding: 0.35rem 0.5rem; border-bottom: 1px solid #24292a; }
      th { font-weight: 600; opacity: 0.6; }
      td code { color: #eef3ef; }
      .note { margin-top: 0.8rem; font-size: 0.78rem; opacity: 0.6; }
    </style>
  </head>
  <body>
    <header>
      <h1>Beeper</h1>
      <span class="state" id="state">starting</span>
    </header>

    <div class="layout">
      <section class="pager" aria-label="Pager screen">
        <span class="lamp" id="lamp" data-risk="green"></span>
        <div class="lcd" id="lcd" role="status" aria-live="polite">
          <div class="row empty">No pages.</div>
          <div class="row empty">Your agents are fine.</div>
        </div>
      </section>

      <section aria-label="Pending approvals">
        <table>
          <thead>
            <tr><th>Code</th><th>Station</th><th>Line</th><th>Waiting</th></tr>
          </thead>
          <tbody id="pending">
            <tr><td colspan="4">No approval waiting.</td></tr>
          </tbody>
        </table>
        <p class="note">
          Read-only. A decision is signed by the paired pager, never taken from this tab.
        </p>
      </section>
    </div>

    <script src="./page.js"></script>
  </body>
</html>
