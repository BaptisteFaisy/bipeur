name: pages

# The pager is a static PWA: it can live on GitHub Pages, next to the code it
# comes from, at an address that belongs to the repository and costs nothing.
#
#   https://tradoooo.github.io/bipeur/       the showcase (landing)
#   https://tradoooo.github.io/bipeur/app/   the pager PWA
#   https://tradoooo.github.io/bipeur/docs/  the documentation, rendered
#
# The landing and the docs are assembled by @bipeur/site around the pager's
# own vite build; the whole tree is one Pages artifact.
#
# The Central stays a server (API, WebSocket, SQLite); the browser asks it
# directly, which is why the Central answers CORS for this origin and why the
# pager takes the Central's URL from the build, from `?central=`, or from the
# setting it remembers.
#
# This build is a native one, so it runs outside the pull-request CI (the PR
# verdict stays inside five minutes).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      central_url:
        description: 'Central the pager talks to (empty = same origin)'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare the Pages site
        id: pages
        uses: actions/configure-pages@v5

      # No `version:` here: the action reads `packageManager` from
      # package.json, and giving both makes it refuse to run ("Multiple
      # versions of pnpm specified").
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Build the site (landing, pager, docs)
        env:
          # The repository page lives under /bipeur/; the pager PWA lives one
          # level deeper, under /bipeur/app/, and every absolute path in each
          # build follows its own base (service worker, manifest, icons).
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
          CENTRAL_URL: ${{ inputs.central_url || 'https://r630-debian.tail3a8bdf.ts.net' }}
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          pnpm --filter @bipeur/core build
          PAGER_BASE="${SITE_BASE%/}/app/" PAGER_CENTRAL_URL="$CENTRAL_URL" \
            pnpm --filter @bipeur/pager build
          echo "site base: $SITE_BASE"
          echo "central: $CENTRAL_URL"
          test -f packages/pager/dist/index.html
          test -f packages/pager/dist/sw.js
          pnpm --filter @bipeur/site build
          SITE_BASE="${SITE_BASE%/}/" CENTRAL_URL="$CENTRAL_URL" \
            node packages/site/dist/build.js
          test -f site-dist/index.html
          test -f site-dist/site.css
          test -f site-dist/app/index.html
          test -f site-dist/app/sw.js
          test -f site-dist/docs/index.html

      - name: Upload the artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
