name: 'Bipeur gate'
description: >-
  Page a human before this step runs: the Central composes one line from the
  facts, the pager signs the answer, and the job fails on a refusal, an expiry
  or an unreachable Central. Never deploys on a timeout. (BIP-F-48)
author: 'Bipeur'

branding:
  icon: 'bell'
  color: 'orange'

inputs:
  url:
    description: 'Base URL of the Central, e.g. https://pager.example.com. A variable, not a secret.'
    required: true
  token:
    description: >-
      Station token of the Central. Always pass it from a secret
      (secrets.BIPEUR_STATION_TOKEN) — never a literal, never a workflow env block.
    required: true
  command:
    description: >-
      What the job is about to run, in one line. This is the fact the human
      decides on; the agent narrative is not enough (A.6).
    required: true
  timeout-minutes:
    description: >-
      How long this step waits for a decision. When it runs out the page is
      unanswered and the job fails — a timeout is never an approval.
    required: false
    default: '10'
  ttl-minutes:
    description: 'Lifetime of the page on the pager. Defaults to timeout-minutes.'
    required: false
  station:
    description: 'Station the page belongs to; the attention budget is counted per station. Defaults to the repository name.'
    required: false
  tool:
    description: 'Name of the tool doing the work, shown on the page. Default github-action.'
    required: false
    default: 'github-action'
  path:
    description: 'File or directory the command touches, when there is one.'
    required: false
  cwd:
    description: 'Working directory of the command. Defaults to GITHUB_WORKSPACE.'
    required: false
  ref:
    description: 'Branch or ref the job runs on. Defaults to GITHUB_REF.'
    required: false
  sha:
    description: >-
      Commit the decision is bound to. Defaults to GITHUB_SHA: the fingerprint
      covers it, so an approval signed for one commit cannot answer another.
    required: false
  stats:
    description: 'Extra facts shown next to the commit (run id, image tag, size…), 160 characters max.'
    required: false
  reason:
    description: >-
      Why the agent wants this. Shown last, prefixed AGENT SAYS — the human
      decides on the facts above, never on this text (A.6).
    required: false
  allow-choice:
    description: 'Letter that means "run it" when the human answers with a choice page. Default A.'
    required: false
    default: 'A'
  dedupe-key:
    description: 'Idempotency key. Defaults to repo + run id + attempt + sha, so a retried job never reuses an old page.'
    required: false

outputs:
  page_id:
    description: 'Id of the page, so a later step can close it (POST /v1/closures).'
  line:
    description: 'The 80-character line the human read, composed by the Central.'
  fingerprint:
    description: 'SHA-256 of the facts the decision was signed on.'
  status:
    description: 'approved, denied, choice, expired, cancelled, pending or unreachable.'
  choice:
    description: 'Letter the human picked, when the verdict was a choice.'
  simulated:
    description: 'true when shadow mode answered and no human decided — which fails the gate.'
  latency_ms:
    description: 'Time the human took, from page to signature.'
  outcome:
    description: 'pass or fail. fail sets the exit code of the step.'
  why:
    description: 'One line explaining the outcome, safe to print.'

runs:
  using: 'node20'
  main: 'index.js'
