name: 'Toolchain (self-hosted)'
description: 'Put the Node/pnpm toolchain of THIS runner on PATH'

runs:
  using: 'composite'
  steps:
    - name: Put the Node toolchain on PATH
      shell: bash
      run: |
        # The runners are not all the same machine: the R630 has a pinned Node
        # in ~/tools, the workstation uses its npm global prefix. Each runner
        # contributes the directory it actually owns, in order of preference.
        for dir in \
          "$HOME/tools/node-v24.11.0-linux-x64/bin" \
          "/home/baptiste/tools/node-v24.11.0-linux-x64/bin" \
          "$HOME/.local/bin" \
          "$HOME/.local/opt/bin" \
          "$HOME/.local/share/pnpm"; do
          if [ -x "$dir/node" ] || [ -x "$dir/pnpm" ]; then
            echo "$dir" >> "$GITHUB_PATH"
          fi
        done
